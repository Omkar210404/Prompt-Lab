[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-lab"
version = "0.1.0"
description = "Run prompt variants over a test set, score the outputs, and compare the results side by side."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Omkar Satish Nikam" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "PyYAML>=6",
    "pydantic>=2.6",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "Jinja2>=3.1",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
prompt-lab = "promptlab.cli:app"

[tool.setuptools.packages.find]
include = ["promptlab*"]

[tool.setuptools.package-data]
promptlab = ["report/templates/*", "scaffold/*", "scaffold/**/*", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
